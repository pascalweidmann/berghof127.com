<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Berghof127 – Ausstellungsraum</title>

  <meta name="description" content="Berghof127 – Kunst- und Ausstellungsraum. Ausstellung 2026, Ausstellungsarchiv und Open Call."/>
  <link rel="canonical" href="https://www.berghof127.com/"/>

  <meta property="og:type" content="website"/>
  <meta property="og:title" content="Berghof127 – Ausstellungsraum"/>
  <meta property="og:description" content="Berghof127 – Kunst- und Ausstellungsraum. Ausstellung 2026 und Ausstellungsarchiv."/>
  <meta property="og:url" content="https://www.berghof127.com/"/>
  <meta property="og:image" content="https://www.berghof127.com/hintergrundbild.jpg"/>
  <meta name="twitter:card" content="summary_large_image"/>

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="apple-touch-icon" href="apple-touch-icon.png"/>

  <link rel="stylesheet" href="style.css"/>
</head>

<body>
  <div class="bg"></div>

<main>

  <!-- HERO -->
  <section class="section" id="home">
    <div class="frame">

      <h1>BERGHOF127</h1>

      <nav class="links">
        <a href="https://www.instagram.com/berghof127/">Instagram</a>
        <a href="mailto:info@pascalweidmann.com">Mail</a>
        <a href="https://beeren.ch" target="_blank">Beeren.ch</a>
        <a href="https://pascalweidmann.com" target="_blank" class="pw-link">
          <span class="pw-full">Pascal Weidmann</span>
          <span class="pw-short">P. Weidmann</span>
        </a>
      </nav>

      <div class="cta-down" id="ctaDown">
        <a class="button button-ausstellung" href="Flyer_Berghof_2026.pdf" download>Ausstellung 2026</a>
        <a class="button" href="#portfolio">Ausstellungsarchiv ↓</a>
      </div>
    </div>
    <div class="supporter-fixed">
      <div class="supporter-label">unterstützt durch:</div>
      <img src="logo_kulturkomission.png" alt="Kulturkommission Embrach">
    </div>
  </section>

  <!-- AUSSTELLUNGSARCHIV -->
  <section class="section portfolio" id="portfolio">

    <header class="portfolio-head frame">
      <h2>Ausstellungsarchiv</h2>
      <a class="button" href="Ausstellungsarchiv_Berghof127.pdf" download>PDF</a>
    </header>

    <div class="portfolio-pages" id="portfolioPages"></div>

  </section>

</main>

<footer class="site-footer">
  © 2026 Berghof127 / Pascal Weidmann – Alle Rechte vorbehalten. Vervielfältigung oder Verwendung der Arbeiten nur mit ausdrücklicher Genehmigung.
</footer>

<script>
(function(){

  const cta = document.getElementById('ctaDown');
  const portfolio = document.getElementById('portfolio');

  if ('IntersectionObserver' in window){
    const io = new IntersectionObserver((entries)=>{
      entries.forEach(entry=>{
        if(entry.isIntersecting){
          cta.classList.add('is-hidden');
        } else {
          cta.classList.remove('is-hidden');
        }
      });
    }, { threshold: 0.2 });

    io.observe(portfolio);
  }

  /* Load images from folder "dossier" */
  const PAGES = 46; /* Bei neuem Ausstellungsarchiv: an Seitenzahl des PDFs anpassen! */
  const container = document.getElementById('portfolioPages');

  for(let i = 1; i <= PAGES; i++){
    const wrapper = document.createElement('div');
    wrapper.className = 'portfolio-page';

    const img = document.createElement('img');
    img.loading = 'lazy';
    img.src = `dossier/dossier${i}.jpg`;
    img.alt = `Ausstellungsarchiv Berghof127 – Seite ${i}`;

    img.onerror = () => wrapper.remove();

    wrapper.appendChild(img);
    container.appendChild(wrapper);
  }

})();
</script>

</body>
</html>
